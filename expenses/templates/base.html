<!-- expenses/templates/base.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 16px;
    }

    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    nav a {
      color: #667eea;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    nav a:hover {
      background: #667eea;
      color: white;
    }

    .content-card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .messages {
      margin-bottom: 20px;
    }

    .messages > div {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .danger, .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    table th {
      background: #f8f9fa;
      color: #495057;
      font-weight: 600;
      padding: 14px;
      text-align: left;
      border-bottom: 2px solid #dee2e6;
    }

    table td {
      padding: 12px 14px;
      border-bottom: 1px solid #e9ecef;
    }

    table tr:hover {
      background: #f8f9fa;
    }

    table tr:last-child td {
      border-bottom: none;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn-link {
      background: transparent;
      color: #667eea;
      padding: 10px 16px;
    }

    .btn-link:hover {
      background: #f8f9fa;
      color: #5568d3;
    }

    form .field {
      margin-bottom: 18px;
    }

    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #495057;
    }

    form input[type="text"],
    form input[type="number"],
    form input[type="date"],
    form input[type="password"],
    form input[type="email"],
    form select,
    form textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .errorlist {
      color: #dc3545;
      font-size: 13px;
      margin-top: 4px;
      list-style: none;
    }

    .filter {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .filter form {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
      width: 100%;
    }

    .filter label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 500;
      color: #495057;
      font-size: 14px;
    }

    .filter input,
    .filter select {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
    }

    .total {
      font-weight: 600;
      font-size: 18px;
      color: #667eea;
      padding: 16px;
      background: #f0f3ff;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .pagination {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e9ecef;
    }

    .pagination a {
      color: #667eea;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 500;
    }

    .pagination a:hover {
      background: #f0f3ff;
    }

    .action-links a {
      color: #667eea;
      text-decoration: none;
      margin: 0 6px;
      font-weight: 500;
    }

    .action-links a:hover {
      color: #5568d3;
      text-decoration: underline;
    }

    .action-links a[href*="delete"] {
      color: #dc3545;
    }

    .action-links a[href*="delete"]:hover {
      color: #c82333;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      header {
        padding: 20px;
      }

      .content-card {
        padding: 20px;
      }

      nav {
        gap: 8px;
      }

      nav a {
        padding: 6px 12px;
        font-size: 14px;
      }

      table {
        font-size: 14px;
      }

      table th,
      table td {
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 Expense Tracker</h1>
      <nav>
        {% if user.is_authenticated %}
        <a href="{% url 'expenses:list' %}">My Expenses</a>
        <a href="{% url 'expenses:create' %}">Add Expense</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
  {% csrf_token %}
  <button type="submit" class="btn btn-primary">Logout</button>
</form>



        {% else %}
          <a href="{% url 'login' %}">Login</a>
          <a href="{% url 'expenses:register' %}">Register</a>
        {% endif %}
      </nav>
    </header>

    <div class="messages">
      {% if messages %}
        {% for m in messages %}
          <div class="{{ m.tags }}">{{ m }}</div>
        {% endfor %}
      {% endif %}
    </div>

    <div class="content-card">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
